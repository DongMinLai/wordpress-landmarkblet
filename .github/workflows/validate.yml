name: Validate WordPress release code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate package scope
        run: python3 scripts/validate.py
      - name: Check PHP 8.2 syntax
        run: |
          docker run --rm -v "$PWD:/code:ro" -w /code php:8.2-cli \
            sh -c 'find wp-content -type f -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Check JavaScript syntax
        run: find wp-content -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build code ZIP
        run: python3 scripts/package.py
      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landmarkus-wordpress-code
          path: dist/*
          if-no-files-found: error
          retention-days: 14
